<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eef3fa" />
    <meta
      name="description"
      content="제2종 전기차량 운전면허 기능시험 구술 암기를 위한 10문제 랜덤 퀴즈"
    />
    <title>구술 암기 퀴즈</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172435;
        --muted: #718096;
        --muted-2: #8a97a8;
        --bg: #edf2f8;
        --paper: #ffffff;
        --line: #e3eaf3;
        --blue: #2289f3;
        --blue-soft: #e7f2ff;
        --teal: #1b9d91;
        --teal-soft: #e3f5f0;
        --purple: #8c65f7;
        --purple-soft: #f1ebff;
        --red: #ed5f68;
        --red-soft: #fff0f1;
        --amber: #ed9a36;
        --amber-soft: #fff5e8;
        --shadow: 0 18px 42px rgba(52, 73, 102, 0.1);
        --answer-font: 15px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        min-height: 100%;
        background: var(--bg);
        overscroll-behavior-y: contain;
      }
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans KR",
          Roboto,
          Arial,
          sans-serif;
        color: var(--ink);
        background:
          radial-gradient(
            ellipse at 10% 8%,
            rgba(208, 226, 250, 0.45),
            transparent 32%
          ),
          radial-gradient(
            ellipse at 95% 75%,
            rgba(223, 232, 250, 0.5),
            transparent 30%
          ),
          linear-gradient(135deg, #eef2f8 0%, #e9eff7 50%, #f4f7fb 100%);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
      }
      button {
        touch-action: manipulation;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(34, 137, 243, 0.3);
        outline-offset: 2px;
      }
      .app-shell {
        width: min(100%, 492px);
        min-height: min(920px, 100dvh);
        margin: 24px auto;
        padding: 0 0 max(18px, env(safe-area-inset-bottom));
        border: 1px solid rgba(255, 255, 255, 0.84);
        border-radius: 30px;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.9),
          rgba(247, 250, 253, 0.82)
        );
        box-shadow: 0 28px 70px rgba(40, 58, 84, 0.13);
        overflow: clip;
        position: relative;
      }
      .app-content {
        padding: max(16px, env(safe-area-inset-top)) 22px 28px;
        min-width: 0;
      }
      button {
        border: 0;
        cursor: pointer;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        display: inline-grid;
        place-items: center;
        border-radius: 13px;
        background: transparent;
        color: #354255;
        font-size: 23px;
        line-height: 1;
        flex: 0 0 auto;
      }
      .icon-btn:hover {
        background: #eff4fa;
      }
      .topbar {
        height: 44px;
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 42px;
        align-items: center;
        margin-bottom: 18px;
      }
      .topbar h2 {
        margin: 0;
        text-align: center;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.035em;
      }
      .topbar .subhead {
        font-size: 11px;
        line-height: 1.4;
        color: var(--muted);
        font-weight: 500;
        text-align: center;
        margin-top: 3px;
      }
      .back-btn {
        font-size: 0;
      }
      .back-btn:before {
        content: "";
        width: 9px;
        height: 9px;
        border-left: 1.8px solid currentColor;
        border-bottom: 1.8px solid currentColor;
        transform: rotate(45deg);
        display: block;
        margin-left: 7px;
      }
      .hero {
        padding: 34px 0 28px;
        text-align: center;
      }
      .hero-mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 25px;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, #e2edff, #f7fbff);
        box-shadow:
          inset 0 1px 0 #fff,
          0 9px 22px rgba(76, 124, 196, 0.08);
        color: var(--blue);
      }
      .hero-mark svg {
        width: 31px;
        height: 31px;
      }
      .hero h1 {
        font-size: 25px;
        line-height: 1.25;
        letter-spacing: -0.065em;
        margin: 0 0 9px;
        font-weight: 850;
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
        letter-spacing: -0.02em;
      }
      .mode-list {
        display: grid;
        gap: 11px;
        margin-top: 7px;
      }
      .mode-card {
        display: flex;
        align-items: center;
        gap: 13px;
        width: 100%;
        min-height: 83px;
        text-align: left;
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 19px;
        background: rgba(255, 255, 255, 0.74);
        box-shadow: 0 6px 18px rgba(58, 80, 110, 0.035);
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease,
          border-color 0.16s ease;
      }
      .mode-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(58, 80, 110, 0.08);
      }
      .mode-card:active {
        transform: scale(0.99);
      }
      .mode-card.old {
        background: linear-gradient(
          110deg,
          rgba(231, 244, 255, 0.86),
          rgba(255, 255, 255, 0.95)
        );
        border-color: #d6eaff;
      }
      .mode-card.new {
        background: linear-gradient(
          110deg,
          rgba(228, 247, 241, 0.82),
          rgba(255, 255, 255, 0.95)
        );
        border-color: #d5f0e7;
      }
      .mode-card.all {
        background: linear-gradient(
          110deg,
          rgba(243, 237, 255, 0.82),
          rgba(255, 255, 255, 0.95)
        );
        border-color: #e8ddff;
      }
      .mode-icon {
        width: 45px;
        height: 45px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .old .mode-icon {
        color: var(--blue);
        background: #dff0ff;
      }
      .new .mode-icon {
        color: var(--teal);
        background: #d9f1ea;
      }
      .all .mode-icon {
        color: var(--purple);
        background: #ece3ff;
      }
      .mode-icon svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mode-copy {
        min-width: 0;
        flex: 1;
      }
      .mode-copy b {
        display: block;
        font-size: 15px;
        margin: 0 0 4px;
        font-weight: 800;
        letter-spacing: -0.035em;
      }
      .mode-copy small {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: -0.01em;
      }
      .card-chevron {
        font-size: 25px;
        color: #428fe8;
        font-weight: 300;
        padding: 0 1px;
      }
      .new .card-chevron {
        color: var(--teal);
      }
      .all .card-chevron {
        color: var(--purple);
      }
      .home-footer {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 22px;
        padding: 13px 8px;
        border: 1px solid rgba(223, 231, 241, 0.82);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.45);
      }
      .feature {
        text-align: center;
        min-width: 0;
      }
      .feature strong {
        display: block;
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 4px;
      }
      .feature span {
        color: var(--muted);
        font-size: 10px;
      }
      .small-note {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.55;
        text-align: center;
        margin: 18px 4px 0;
      }
      .panel {
        padding: 17px 16px;
        border-radius: 20px;
        border: 1px solid rgba(224, 232, 242, 0.9);
        background: rgba(255, 255, 255, 0.75);
        box-shadow: 0 8px 24px rgba(49, 72, 104, 0.045);
      }
      .mode-summary {
        text-align: center;
        padding: 8px 0 22px;
      }
      .mode-summary h1 {
        font-size: 23px;
        letter-spacing: -0.06em;
        margin: 0 0 9px;
      }
      .mode-summary p {
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
        margin: 0;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 999px;
        padding: 7px 11px;
        background: #eef4fa;
        color: #53657d;
        font-size: 11px;
        font-weight: 750;
      }
      .setup-panel {
        margin-top: 3px;
      }
      .section-label {
        font-size: 12px;
        font-weight: 800;
        margin: 0 0 12px;
        letter-spacing: -0.02em;
      }
      .setting-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
      }
      .setting-line:first-of-type {
        margin-top: 0;
      }
      .setting-line b {
        display: block;
        font-size: 12px;
        margin-bottom: 5px;
      }
      .setting-line p {
        margin: 0;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.5;
      }
      .choice-chip {
        border-radius: 999px;
        padding: 9px 15px;
        background: #f0f4f9;
        color: #8390a1;
        font-size: 11px;
        font-weight: 750;
        white-space: nowrap;
      }
      .choice-chip.active {
        color: var(--blue);
        background: #e7f0ff;
        border: 1px solid #cbdfff;
        box-shadow: 0 2px 3px rgba(62, 122, 211, 0.04);
      }
      .setup-info {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 16px 0 0;
      }
      .primary-btn {
        width: 100%;
        min-height: 49px;
        border-radius: 17px;
        padding: 13px 18px;
        color: #fff;
        background: linear-gradient(180deg, #2c3949, #1d2835);
        box-shadow: 0 8px 16px rgba(23, 37, 54, 0.13);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: -0.025em;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }
      .primary-btn:hover {
        background: linear-gradient(180deg, #37495d, #202c3b);
      }
      .primary-btn:active {
        transform: scale(0.99);
      }
      .primary-btn:disabled {
        cursor: not-allowed;
        opacity: 0.38;
        box-shadow: none;
      }
      .secondary-btn {
        width: 100%;
        min-height: 45px;
        border-radius: 15px;
        padding: 11px 16px;
        color: #42526a;
        background: #eef3f9;
        font-weight: 750;
        font-size: 12px;
      }
      .action-area {
        margin-top: 23px;
      }
      .quiz-top {
        display: grid;
        grid-template-columns: 39px 1fr 39px;
        align-items: center;
        gap: 5px;
        margin: 0 0 15px;
      }
      .quiz-count {
        text-align: center;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.02em;
      }
      .quiz-progress {
        height: 6px;
        border-radius: 99px;
        background: #e6ebf3;
        overflow: hidden;
        margin: 0 0 22px;
      }
      .quiz-progress-fill {
        height: 100%;
        width: 0;
        border-radius: 99px;
        background: linear-gradient(90deg, #32b49a, #248c89);
        transition: width 0.25s ease;
      }
      .timer-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 17px;
        margin-bottom: 22px;
      }
      .timer-ring {
        width: 65px;
        height: 65px;
        position: relative;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .timer-ring svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .timer-ring circle {
        fill: none;
        stroke-width: 4.5;
      }
      .timer-track {
        stroke: #e3e8ef;
      }
      .timer-progress {
        stroke: #31ad8b;
        stroke-linecap: round;
        stroke-dasharray: 176;
        stroke-dashoffset: 0;
        transition:
          stroke-dashoffset 0.4s linear,
          stroke 0.2s ease;
      }
      .timer-ring.urgent .timer-progress {
        stroke: var(--red);
      }
      .timer-number {
        position: relative;
        font-size: 19px;
        font-weight: 850;
        font-variant-numeric: tabular-nums;
        color: #269c84;
      }
      .timer-ring.urgent .timer-number {
        color: var(--red);
      }
      .hint-btn {
        border: 1px solid #e1e9f5;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        padding: 10px 13px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 750;
        color: #5d6c82;
        box-shadow: 0 4px 10px rgba(54, 78, 110, 0.045);
      }
      .hint-btn svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
      }
      .hint-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .prompt-wrap {
        text-align: center;
        padding: 2px 0 20px;
      }
      .question-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 5px 9px;
        border-radius: 8px;
        background: #eef4fb;
        color: #74849a;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.02em;
        margin-bottom: 12px;
      }
      .prompt-wrap h1 {
        font-size: 21px;
        line-height: 1.53;
        letter-spacing: -0.055em;
        font-weight: 850;
        margin: 0;
        overflow-wrap: anywhere;
        word-break: keep-all;
      }
      .prompt-helper {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.6;
        margin: 12px 0 0;
      }
      .hint-panel {
        padding: 12px 13px;
        border-radius: 15px;
        border: 1px solid #d4e7fc;
        background: linear-gradient(110deg, #f0f7ff, #fff);
        margin: 0 0 13px;
        display: flex;
        align-items: flex-start;
        gap: 9px;
      }
      .hint-lightbulb {
        width: 29px;
        height: 29px;
        border-radius: 10px;
        background: #dfedff;
        color: #4b94ed;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        font-size: 15px;
      }
      .hint-content {
        min-width: 0;
        flex: 1;
      }
      .hint-content b {
        font-size: 11px;
        display: block;
        margin: 1px 0 6px;
      }
      .hint-content p {
        margin: 0;
        font-size: 14px;
        font-weight: 850;
        letter-spacing: 0.08em;
        color: #2e6fae;
        overflow-wrap: anywhere;
      }
      .hint-close {
        background: transparent;
        color: #8a9bb2;
        font-size: 18px;
        padding: 1px 3px;
      }
      .answer-panel {
        margin: 0 0 14px;
        padding: 15px 14px;
        border-radius: 17px;
        border: 1px solid #dfe8f2;
        background: linear-gradient(
          135deg,
          rgba(247, 250, 254, 0.98),
          rgba(255, 255, 255, 0.98)
        );
        box-shadow: inset 0 1px 0 #fff;
        animation: rise 0.22s ease;
      }
      .answer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .answer-head strong {
        font-size: 12px;
        font-weight: 850;
      }
      .answer-badge {
        font-size: 10px;
        color: #278b7c;
        background: #e2f5ef;
        padding: 5px 8px;
        border-radius: 8px;
        font-weight: 800;
      }
      .answer-text {
        font-size: var(--answer-font);
        line-height: 1.75;
        color: #2a3747;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: normal;
        letter-spacing: -0.02em;
        user-select: text;
        max-width: 100%;
      }
      .self-grade {
        margin: 0 0 14px;
      }
      .self-grade .section-label {
        margin-bottom: 10px;
      }
      .grade-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .grade-btn {
        min-width: 0;
        padding: 12px 4px 10px;
        border: 1px solid #e4ebf3;
        border-radius: 15px;
        background: #fff;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 5px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .grade-symbol {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-size: 20px;
        font-weight: 900;
      }
      .grade-btn b {
        font-size: 10px;
        line-height: 1.3;
      }
      .grade-btn small {
        font-size: 9px;
        color: var(--muted);
        line-height: 1.35;
      }
      .grade-btn[data-grade="O"] .grade-symbol {
        background: #e3f6ef;
        color: #19a878;
      }
      .grade-btn[data-grade="△"] .grade-symbol {
        background: #fff2df;
        color: #ed9a36;
      }
      .grade-btn[data-grade="X"] .grade-symbol {
        background: #fff0f1;
        color: #e85a63;
      }
      .grade-btn.selected[data-grade="O"] {
        background: #f0fbf6;
        border-color: #63d6ab;
      }
      .grade-btn.selected[data-grade="△"] {
        background: #fff9ef;
        border-color: #facb86;
      }
      .grade-btn.selected[data-grade="X"] {
        background: #fff5f5;
        border-color: #f59aa0;
      }
      .timeout-note {
        margin: 0 auto 12px;
        color: #ca565e;
        text-align: center;
        font-size: 11px;
        font-weight: 750;
      }
      .explain-note {
        font-size: 10px;
        color: var(--muted);
        text-align: center;
        line-height: 1.6;
        margin: 12px 0 0;
      }
      .result-hero {
        text-align: center;
        padding: 12px 0 18px;
      }
      .result-hero .success-icon {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        margin: 0 auto 14px;
        color: #21a77b;
        background: #e2f7ee;
        border: 1px solid #c4efdc;
        font-size: 28px;
        font-weight: 900;
      }
      .result-hero h1 {
        margin: 0 0 7px;
        font-size: 22px;
        letter-spacing: -0.05em;
      }
      .result-hero p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0;
        border: 1px solid #e4eaf2;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.78);
        padding: 14px 6px;
        margin: 0 0 17px;
      }
      .summary-stat {
        text-align: center;
        padding: 0 5px;
        min-width: 0;
      }
      .summary-stat + .summary-stat {
        border-left: 1px solid #e6ecf3;
      }
      .summary-stat .num {
        font-size: 21px;
        font-weight: 850;
        display: block;
        margin-bottom: 5px;
      }
      .summary-stat b {
        display: block;
        font-size: 10px;
        margin-bottom: 4px;
      }
      .summary-stat small {
        font-size: 9px;
        color: var(--muted);
      }
      .summary-stat.good .num {
        color: #18aa79;
      }
      .summary-stat.partial .num {
        color: #ef9c38;
      }
      .summary-stat.retry .num {
        color: #e75a63;
      }
      .list-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 10px;
      }
      .list-heading b {
        font-size: 12px;
      }
      .list-heading span {
        font-size: 10px;
        color: var(--muted);
      }
      .result-list {
        border: 1px solid #e1e8f1;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.8);
        overflow: hidden;
      }
      .result-row {
        width: 100%;
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr) 24px 12px;
        align-items: center;
        gap: 8px;
        text-align: left;
        background: transparent;
        padding: 12px 11px;
        border-bottom: 1px solid #edf1f6;
        min-height: 52px;
      }
      .result-row:last-child {
        border-bottom: 0;
      }
      .result-row:hover {
        background: #f6f9fd;
      }
      .result-index {
        color: #7d8ca1;
        font-size: 10px;
        font-weight: 750;
        text-align: center;
      }
      .row-question {

      function escapeHTML(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (ch) =>

              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[ch],
        );
      }
      function shuffle(items) {
        const arr = items.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

          if (view !== "quiz" || answerShown) {
            clearTimer();
            return;
          }
          timeLeft = Math.max(0, timeLeft - 1);
          updateTimerUI();
          if (timeLeft <= 0) revealAnswer(true);
        }, 1000);
      }
      function updateTimerUI() {
        const number = document.getElementById("timer-number");
        const ring = document.getElementById("timer-ring");
        const progress = document.getElementById("timer-progress");
        if (!number || !ring || !progress) return;
        number.textContent = String(timeLeft);
        ring.classList.toggle("urgent", timeLeft <= 10);
        const circumference = 176;
        progress.style.strokeDashoffset = String(
          circumference * (1 - timeLeft / 60),
        );
      }
      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");

        toastId = setTimeout(() => toast.classList.remove("show"), 2100);
      }
      function itemCount(mode) {
        if (mode === "old") return OLD_QUESTIONS.length;
        if (mode === "new") return NEW_QUESTIONS.length;
        return ALL_QUESTIONS.length;

        return mode === "old" ? "구구술" : mode === "new" ? "신구술" : "종합";
      }

        clearTimer();
        view = "home";
        render();
        window.scrollTo({ top: 0, behavior: "auto" });

        selectedMode = mode;
        view = "setup";
        render();
        window.scrollTo({ top: 0, behavior: "auto" });
      }
      function startQuiz(mode = selectedMode, customItems = null) {
        clearTimer();
        selectedMode = mode;
        const bank =
          customItems ||
          (mode === "old"
            ? OLD_QUESTIONS
            : mode === "new"
              ? NEW_QUESTIONS
              : ALL_QUESTIONS);
        queue = customItems ? bank.slice() : shuffle(bank).slice(0, 10);
        currentIndex = 0;
        sessionResults = [];
        isRetrySession = Boolean(customItems);
        view = "quiz";
        loadQuestion();
      }
      function loadQuestion() {
        clearTimer();
        answerShown = false;
        hintVisible = false;
        selectedGrade = null;
        timeLeft = 60;
        view = "quiz";
        render();
        startTimer(true);
        window.scrollTo({ top: 0, behavior: "auto" });
      }
      function revealAnswer(byTimeout = false) {
        if (answerShown) return;
        clearTimer();
        answerShown = true;
        if (byTimeout) timeLeft = 0;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function toggleHint() {
        if (!settings.showHint) {
          showToast("설정에서 힌트 보기를 켤 수 있어요.");
          return;
        }
        hintVisible = !hintVisible;
        render();
        updateTimerUI();
      }
      function rateAnswer(grade) {
        if (!answerShown) return;
        selectedGrade = grade;
        render();
        updateTimerUI();
      }
      function nextQuestion() {
        if (!answerShown || !selectedGrade) return;
        const question = queue[currentIndex];
        sessionResults[currentIndex] = {
          item: question,
          grade: selectedGrade,
          timeUsed: 60 - timeLeft,
        };
        if (currentIndex + 1 < queue.length) {
          currentIndex += 1;
          loadQuestion();
        } else {
          clearTimer();
          view = "results";
          render();
          window.scrollTo({ top: 0, behavior: "auto" });
        }
      }
      function exitQuiz() {

        view = settingsReturn || "home";

        settings.showHint = checked;

      }
      function backToResults() {
        view = "results";
        render();
        window.scrollTo({ top: 0, behavior: "auto" });
      }

        const missed = sessionResults
          .filter((result) => result.grade !== "O")
          .map((result) => result.item);

          ? missed
          : sessionResults.map((result) => result.item);
        startQuiz(selectedMode, selected);
      }

        startQuiz(selectedMode);

        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
      const arrowSVG =
        '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

      function renderHome() {
        return `
    <div class="topbar"><span></span><h2> </h2><button class="icon-btn" onclick="openSettings()" aria-label="설정">${gearSVG}</button></div>
    <section class="hero">
      <div class="hero-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5c2.8-1 5.3-.7 8 1.2 2.7-1.9 5.2-2.2 8-1.2v13c-2.8-1-5.3-.7-8 1.2-2.7-1.9-5.2-2.2-8-1.2z"/><path d="M12 6.7v13"/></svg></div>
      <h1>구술 암기 퀴즈</h1>
      <p>오늘도, 조금 더 기억할 수 있도록</p>
    </section>
    <section class="mode-list" aria-label="퀴즈 종류">
      <button class="mode-card old" onclick="selectMode('old')"><span class="mode-icon">${bookSVG}</span><span class="mode-copy"><b>구구술</b><small>6.1 ~ 6.81 · ${OLD_QUESTIONS.length}개 문항</small></span><span class="card-chevron">›</span></button>
      <button class="mode-card new" onclick="selectMode('new')"><span class="mode-icon">${docSVG}</span><span class="mode-copy"><b>신구술</b><small>101 ~ 190 · ${NEW_QUESTIONS.length}개 문항</small></span><span class="card-chevron">›</span></button>
      <button class="mode-card all" onclick="selectMode('all')"><span class="mode-icon">${starSVG}</span><span class="mode-copy"><b>종합</b><small>구구술 + 신구술 · ${ALL_QUESTIONS.length}개 문항</small></span><span class="card-chevron">›</span></button>
    </section>
    <section class="home-footer" aria-label="퀴즈 안내"><div class="feature"><strong>10문제</strong><span>한 게임 분량</span></div><div class="feature"><strong>60초</strong><span>문제별 제한 시간</span></div><div class="feature"><strong>앞글자</strong><span>힌트 제공</span></div></section>
    <p class="small-note">문제 제목을 보고 소리 내어 답변한 뒤, 원문 정답을 확인하세요.</p>`;
      }
      function renderSetup() {
        const mode = selectedMode;
        return `
    <div class="topbar"><button class="icon-btn back-btn" onclick="goHome()" aria-label="뒤로"></button><h2>${modeName(mode)}</h2><button class="icon-btn" onclick="openSettings()" aria-label="설정">${gearSVG}</button></div>
    <div class="mode-summary"><h1>총 ${itemCount(mode)}문항</h1><p>${mode === "all" ? "구구술과 신구술이 섞여서 출제됩니다." : mode === "old" ? "6.1부터 6.81까지 구구술 문항입니다." : "101번부터 190번까지 신구술 문항입니다."}<br>한 게임에 무작위 10문제가 출제됩니다.</p></div>
    <section class="panel setup-panel">
      <h3 class="section-label">문제 설정</h3>
      <div class="setting-line"><div><b>출제 방식</b><p>매 게임 문제 순서가 달라집니다.</p></div><span class="choice-chip active">랜덤</span></div>
      <div class="setting-line"><div><b>제한 시간</b><p>시간이 끝나면 정답이 자동으로 표시됩니다.</p></div><span class="choice-chip active">1분</span></div>
      <div class="setup-info"><span class="pill">✓ 중복 없이 10문제</span><span class="pill">✓ 앞글자 힌트</span></div>
    </section>
    <div class="action-area"><button class="primary-btn" onclick="startQuiz('${mode}')">시작하기&nbsp; ${arrowSVG}</button></div>
    <p class="small-note">정답은 PDF 원문 표현을 기준으로 표시됩니다.</p>`;
      }
      function renderQuiz() {
        const q = queue[currentIndex];
        if (!q)
          return '<div class="panel">문항을 불러오지 못했습니다. 처음 화면으로 돌아가 다시 시작해주세요.</div>';
        const pct = Math.max(0, ((currentIndex + 1) / queue.length) * 100);
        const status =
          timeLeft <= 0
            ? "시간이 종료되었습니다."
            : "다음에 대한 개념을 설명해보세요.";
        const hintBlock =
          hintVisible && settings.showHint
            ? `<section class="hint-panel"><span class="hint-lightbulb">💡</span><div class="hint-content"><b>힌트</b><p>${escapeHTML(q.hint || "힌트 없음")}</p></div><button class="hint-close" onclick="toggleHint()" aria-label="힌트 닫기">×</button></section>`
            : "";
        const answerBlock = answerShown
          ? `
    <section class="answer-panel"><div class="answer-head"><strong>정답 · 원문</strong><span class="answer-badge">전체 답변</span></div><div class="answer-text">${escapeHTML(q.answer)}</div></section>
    <section class="self-grade"><h3 class="section-label">내 답변을 스스로 평가하세요</h3><div class="grade-grid">
      <button class="grade-btn ${selectedGrade === "O" ? "selected" : ""}" data-grade="O" onclick="rateAnswer('O')"><span class="grade-symbol">○</span><b>완전암기</b><small>막힘없이 답변</small></button>
      <button class="grade-btn ${selectedGrade === "△" ? "selected" : ""}" data-grade="△" onclick="rateAnswer('△')"><span class="grade-symbol">△</span><b>부분암기</b><small>일부가 헷갈림</small></button>
      <button class="grade-btn ${selectedGrade === "X" ? "selected" : ""}" data-grade="X" onclick="rateAnswer('X')"><span class="grade-symbol">×</span><b>다시암기</b><small>답변이 어려움</small></button>
    </div><p class="explain-note">본인이 실제로 말한 답변을 기준으로 선택해주세요.</p></section>`
          : "";
        return `
    <div class="quiz-top"><button class="icon-btn" onclick="exitQuiz()" aria-label="퀴즈 종료">×</button><div class="quiz-count">${currentIndex + 1} / ${queue.length}</div><button class="icon-btn" onclick="openSettings()" aria-label="설정">${gearSVG}</button></div>
    <div class="quiz-progress" aria-label="진행률"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
    <div class="timer-row"><div id="timer-ring" class="timer-ring ${timeLeft <= 10 ? "urgent" : ""}" aria-label="남은 시간 ${timeLeft}초"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="timer-track" cx="32" cy="32" r="28"/><circle id="timer-progress" class="timer-progress" cx="32" cy="32" r="28" style="stroke-dasharray:176;stroke-dashoffset:${176 * (1 - timeLeft / 60)}"/></svg><span id="timer-number" class="timer-number">${timeLeft}</span></div>
      <button class="hint-btn" onclick="toggleHint()" ${!settings.showHint ? 'disabled title="설정에서 힌트를 켜세요"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M8.1 14.7a6 6 0 1 1 7.8 0c-.9.7-1.4 1.5-1.6 2.3H9.7c-.2-.8-.7-1.6-1.6-2.3Z"/></svg>힌트 보기</button></div>
    <section class="prompt-wrap"><div class="question-tag">${escapeHTML(q.id)} · ${q.kind === "old" ? "구구술" : "신구술"}</div><h1>${escapeHTML(q.title)}</h1><p class="prompt-helper">${answerShown ? status : "질문을 보고 답변을 소리 내어 말해보세요."}</p></section>
    ${hintBlock}
    ${answerBlock}
    <div class="action-area">${answerShown ? `<button class="primary-btn" onclick="nextQuestion()" ${!selectedGrade ? "disabled" : ""}>${currentIndex + 1 === queue.length ? "결과 확인" : "다음 문제"} &nbsp; ${arrowSVG}</button>` : `<button class="primary-btn" onclick="revealAnswer(false)">정답 확인하기</button>`}</div>
    ${answerShown && !selectedGrade ? '<p class="explain-note">정답을 확인한 뒤 암기 정도를 선택하면 다음 문제로 넘어갈 수 있어요.</p>' : ""}`;
      }
      function renderResults() {
        const total = sessionResults.length;
        const good = countGrade("O"),
          partial = countGrade("△"),
          retry = countGrade("X");
        const details = sessionResults
          .map(
            (r, i) => `
    <button class="result-row" onclick="openDetail(${i})"><span class="result-index">${i + 1}</span><span class="row-question"><b>${escapeHTML(r.item.id)} ${escapeHTML(r.item.title)}</b><small>${r.grade === "O" ? "완전암기" : r.grade === "△" ? "부분암기" : "다시암기"}</small></span><span class="grade-mini ${r.grade}">${r.grade === "X" ? "×" : r.grade}</span><span class="row-chevron">›</span></button>`,
          )
          .join("");
        const allO = good === total;
        return `
    <div class="topbar"><button class="icon-btn back-btn" onclick="goHome()" aria-label="처음 화면"></button><h2>학습 결과</h2><button class="icon-btn" onclick="openSettings()" aria-label="설정">${gearSVG}</button></div>
    <section class="result-hero"><span class="success-icon">✓</span><h1>${allO ? "훌륭해요!" : "학습을 완료했어요"}</h1><p>${modeName(selectedMode)} · ${total}문제 학습 완료<br>스스로 평가한 암기 상태를 확인해보세요.</p></section>
    <section class="summary-grid"><div class="summary-stat good"><span class="num">${good}</span><b>완전암기</b><small>바로 답변 가능</small></div><div class="summary-stat partial"><span class="num">${partial}</span><b>부분암기</b><small>한 번 더 복습</small></div><div class="summary-stat retry"><span class="num">${retry}</span><b>다시암기</b><small>반복 학습 추천</small></div></section>
    <div class="list-heading"><b>문제별 결과</b><span>${total}문항</span></div>
    <section class="result-list">${details}</section>
    <div class="result-actions"><button class="primary-btn" onclick="startRetry()">${retry + partial ? "다시암기 문항 복습하기" : "이번 문항 다시 풀기"}</button><button class="secondary-btn" onclick="restartSameMode()">같은 유형으로 새 퀴즈</button><button class="secondary-btn" onclick="goHome()">처음으로</button></div>`;
      }
      function renderDetail() {
        const result = sessionResults[detailIndex];
        if (!result)
          return `<div class="topbar"><button class="icon-btn back-btn" onclick="backToResults()" aria-label="결과"></button><h2>결과 상세</h2><span></span></div>`;
        const gradeLabel =
          result.grade === "O"
            ? "완전암기"
            : result.grade === "△"
              ? "부분암기"
              : "다시암기";
        const gradeSymbol = result.grade === "X" ? "×" : result.grade;
        return `
    <div class="topbar"><button class="icon-btn back-btn" onclick="backToResults()" aria-label="결과 목록"></button><h2>결과 상세</h2><button class="icon-btn" onclick="backToResults()" aria-label="닫기">×</button></div>
    <div class="detail-title"><div class="question-tag">${escapeHTML(result.item.id)} · ${detailIndex + 1}/${sessionResults.length}</div><h1>${escapeHTML(result.item.title)}</h1><p><strong class="grade-mini ${result.grade}" style="font-size:16px">${gradeSymbol}</strong> ${gradeLabel}</p></div>
    <section class="answer-panel"><div class="answer-head"><strong>정답 · 원문</strong><span class="answer-badge">전체 답변</span></div><div class="answer-text">${escapeHTML(result.item.answer)}</div></section>
    <div class="result-actions"><button class="primary-btn" onclick="${detailIndex + 1 < sessionResults.length ? "detailIndex++;render();window.scrollTo({top:0,behavior:'smooth'})" : "backToResults()"}">${detailIndex + 1 < sessionResults.length ? "다음 결과" : "결과 목록으로 돌아가기"}</button><button class="secondary-btn" onclick="${detailIndex > 0 ? "detailIndex--;render();window.scrollTo({top:0,behavior:'smooth'})" : "backToResults()"}">${detailIndex > 0 ? "이전 결과" : "결과 목록"}</button></div>`;
      }
      function renderSettings() {
        return `
    <div class="topbar"><button class="icon-btn back-btn" onclick="backFromSettings()" aria-label="뒤로"></button><h2>설정</h2><span></span></div>
    <section class="panel settings-section"><h3>문제 설정</h3>
      <div class="preference"><div class="pref-copy"><b>출제 방식</b><p>매 게임마다 무작위 10문제 출제</p></div><span class="choice-chip active">랜덤</span></div>
      <div class="preference"><div class="pref-copy"><b>제한 시간</b><p>문제당 60초 · 종료 시 자동 정답 표시</p></div><span class="choice-chip active">1분</span></div>
      <div class="preference"><div class="pref-copy"><b>힌트 보기</b><p>답변 항목의 첫 글자만 표시합니다.</p></div><input class="toggle" type="checkbox" ${settings.showHint ? "checked" : ""} onchange="toggleHintSetting(this.checked)" aria-label="힌트 보기"></div>
    </section>
    <section class="panel settings-section"><h3>읽기 설정</h3>
      <div class="preference"><div class="pref-copy"><b>정답 글자 크기</b><p>긴 답변을 편하게 확인할 수 있어요.</p></div><div class="font-choices"><button class="${settings.answerFont === 14 ? "active" : ""}" onclick="setAnswerFont(14)">보통</button><button class="${settings.answerFont === 16 ? "active" : ""}" onclick="setAnswerFont(16)">크게</button><button class="${settings.answerFont === 18 ? "active" : ""}" onclick="setAnswerFont(18)">더 크게</button></div></div>
    </section>
    <p class="inline-info">문항과 정답은 제공된 PDF를 바탕으로 구성했습니다. 참고·당구장 표시를 포함한 답변 원문 전체가 표시되며, 힌트에서는 구분어와 참고 문구를 제외합니다.</p>
    <div class="action-area"><button class="primary-btn" onclick="backFromSettings()">설정 완료</button></div>`;
      }
      function render() {
        document.documentElement.style.setProperty(
          "--answer-font",
          settings.answerFont + "px",
        );
        const pages = {
          home: renderHome,
          setup: renderSetup,
          quiz: renderQuiz,
          results: renderResults,
          detail: renderDetail,
          settings: renderSettings,
        };
        $app.innerHTML = (pages[view] || renderHome)();
        updateTimerUI();
      }
      render();
    </script>
  </body>
</html>
